<script>
(async function(){
  const P = JSON.parse(document.getElementById('dados').textContent);
  const de64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const norm = s => String(s).trim().toLowerCase().replace(/\s+/g,'-');
  const LS = 'cj-codigos';
  const guardados = () => { try { return JSON.parse(localStorage.getItem(LS) || '[]'); } catch(e) { return []; } };
  const guardar = c => { try { const g = guardados().filter(x => x !== c); g.unshift(c); localStorage.setItem(LS, JSON.stringify(g.slice(0,4))); } catch(e) {} };
  async function abrir(codigo){
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm(codigo)), 'PBKDF2', false, ['deriveKey']);
    for (const k of P.chaves) {
      try {
        const kek = await crypto.subtle.deriveKey({name:'PBKDF2', salt:de64(k.sal), iterations:P.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
        const cek = await crypto.subtle.decrypt({name:'AES-GCM', iv:de64(k.iv)}, kek, de64(k.ct));
        const ck = await crypto.subtle.importKey('raw', cek, 'AES-GCM', false, ['decrypt']);
        const gz = await crypto.subtle.decrypt({name:'AES-GCM', iv:de64(P.conteudo.iv)}, ck, de64(P.conteudo.ct));
        const html = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
        return html;
      } catch(e) { /* este código não abre esta chave: tenta a seguinte */ }
    }
    return null;
  }
  function mostrar(html){
    const botao = '<div style="height:64px"></div><a href="../" style="position:fixed;z-index:99999;left:max(10px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom));background:rgba(20,20,18,.82);color:#fff;font:600 14px -apple-system,system-ui,sans-serif;padding:9px 13px;border-radius:999px;text-decoration:none;box-shadow:0 2px 10px rgba(0,0,0,.25)">← Início</a>';
    const corpo = '<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"></head><body>' + html + botao + '</body></html>';
    document.open(); document.write(corpo); document.close();
  }
  for (const c of guardados()) { const h = await abrir(c); if (h) { mostrar(h); return; } }
  const f = document.getElementById('f'), e = document.getElementById('e'), b = document.getElementById('b');
  f.addEventListener('submit', async ev => {
    ev.preventDefault(); const c = document.getElementById('c').value; if (!c.trim()) return;
    b.disabled = true; b.textContent = 'A abrir…'; e.textContent = '';
    const h = await abrir(c);
    if (h) { guardar(norm(c)); mostrar(h); }
    else { e.textContent = 'Este código não abre esta página.'; b.disabled = false; b.textContent = 'Abrir'; }
  });
})();
